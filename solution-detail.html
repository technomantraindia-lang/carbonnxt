<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solution Details | CarbonNxt</title>
  <meta name="description" content="Explore CarbonNxt solution capabilities for carbon market measurement, reporting, verification, asset digitisation, and advisory.">

  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Global & Page Styles -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    /* ==========================================================================
       Solution Detail Specific Styles
       ========================================================================== */

    .sol-detail-hero {
      position: relative;
      padding-top: clamp(140px, 14vw, 180px);
      padding-bottom: clamp(60px, 8vw, 100px);
      background: linear-gradient(165deg, #04101d 0%, #06182a 50%, #030d18 100%);
      overflow: hidden;
      color: #ffffff;
    }

    .sol-detail-hero__grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: clamp(2rem, 5vw, 4.5rem);
      align-items: center;
    }

    .sol-detail-hero__title {
      font-size: clamp(2.4rem, 4.5vw, 3.8rem) !important;
      line-height: 1.12 !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      margin-bottom: 1.25rem !important;
      letter-spacing: -0.025em !important;
    }

    .sol-detail-hero__tagline {
      font-size: clamp(1.1rem, 1.6vw, 1.3rem);
      font-weight: 600;
      color: #39e49a;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .sol-detail-hero__desc {
      font-size: clamp(1rem, 1.3vw, 1.12rem);
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2.25rem;
      max-width: 62ch;
    }

    .sol-detail-hero__actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .sol-detail-hero__visual {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(57, 228, 154, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      background: rgba(4, 20, 35, 0.9);
      aspect-ratio: 4 / 3;
    }

    .sol-detail-hero__visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.9);
    }

    /* Section 2: Overview Editorial */
    .sol-overview-section {
      padding-block: clamp(80px, 10vw, 120px);
      background: #ffffff;
      color: #0f211a;
    }

    .sol-overview__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(2.5rem, 6vw, 5rem);
      align-items: center;
    }

    .sol-overview__title {
      font-size: clamp(2rem, 3.5vw, 2.8rem) !important;
      font-weight: 800 !important;
      line-height: 1.2 !important;
      color: #0f211a !important;
      margin-bottom: 1.5rem !important;
    }

    .sol-overview__paragraphs p {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #334e42;
      margin-bottom: 1.25rem;
    }

    .sol-overview__visual-card {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(2, 154, 98, 0.15);
      aspect-ratio: 4 / 3;
    }

    .sol-overview__visual-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Section 3: Key Capabilities */
    .sol-caps-section {
      padding-block: clamp(80px, 10vw, 120px);
      background: #f4f8f6;
    }

    .sol-caps__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
      margin-top: 3rem;
    }

    .sol-cap-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(2, 154, 98, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      transition: all 0.35s ease;
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
    }

    .sol-cap-card:hover {
      transform: translateY(-5px);
      border-color: rgba(2, 154, 98, 0.3);
      box-shadow: 0 18px 45px rgba(2, 154, 98, 0.1);
    }

    .sol-cap-card__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(2, 154, 98, 0.1);
      color: #029a62;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sol-cap-card p {
      font-size: 1.02rem;
      font-weight: 600;
      color: #0f211a;
      line-height: 1.45;
      margin: 0;
    }

    /* Section 4: How It Works Process Flow */
    .sol-flow-section {
      padding-block: clamp(80px, 10vw, 120px);
      background: #04101d;
      color: #ffffff;
    }

    .sol-flow__grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.75rem;
      margin-top: 3.5rem;
    }

    .sol-flow-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 2.25rem 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      transition: all 0.35s ease;
    }

    .sol-flow-card:hover {
      border-color: #39e49a;
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-6px);
    }

    .sol-flow-card__step {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(57, 228, 154, 0.15);
      color: #39e49a;
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(57, 228, 154, 0.3);
    }

    .sol-flow-card h3 {
      font-size: 1.25rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      margin-bottom: 0.85rem !important;
    }

    .sol-flow-card p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.75);
      margin: 0;
    }

    /* Section 5 & 6: Audience & Use Cases */
    .sol-pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 2rem;
    }

    .sol-pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(2, 154, 98, 0.2);
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f211a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .sol-pill-tag svg {
      color: #029a62;
    }

    /* Section 8: CarbonNxt Support */
    .sol-support-section {
      padding-block: clamp(80px, 10vw, 120px);
      background: linear-gradient(165deg, #021a12 0%, #04101d 100%);
      color: #ffffff;
    }

    .sol-support__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin-top: 3.5rem;
    }

    .sol-support-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 2.25rem;
      border: 1px solid rgba(57, 228, 154, 0.2);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
    }

    .sol-support-card h3 {
      font-size: 1.3rem !important;
      font-weight: 700 !important;
      color: #39e49a !important;
      margin-bottom: 0.85rem !important;
    }

    .sol-support-card p {
      font-size: 0.98rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.82);
      margin: 0;
    }

    /* Section 9: FAQ Accordion */
    .sol-faq-section {
      padding-block: clamp(80px, 10vw, 120px);
      background: #ffffff;
    }

    .faq-accordion {
      max-width: 840px;
      margin: 3rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .faq-item {
      border: 1px solid rgba(2, 154, 98, 0.16);
      border-radius: 18px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }

    .faq-item.is-open {
      border-color: #029a62;
      box-shadow: 0 10px 30px rgba(2, 154, 98, 0.08);
    }

    .faq-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1.75rem;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f211a;
      text-align: left;
      cursor: pointer;
    }

    .faq-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(2, 154, 98, 0.1);
      color: #029a62;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .faq-item.is-open .faq-icon {
      transform: rotate(180deg);
      background: #029a62;
      color: #ffffff;
    }

    .faq-content {
      padding: 0 1.75rem 1.5rem 1.75rem;
      font-size: 1rem;
      line-height: 1.7;
      color: #4e6057;
      display: none;
    }

    .faq-item.is-open .faq-content {
      display: block;
    }

    .sol-benefits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .sol-benefit-card {
      background: #ffffff;
      padding: 1.85rem 1.75rem;
      border-radius: 20px;
      border: 1px solid rgba(2, 154, 98, 0.15);
      border-left: 4px solid #029a62;
      display: flex;
      align-items: flex-start;
      gap: 1.15rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .sol-benefit-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 45px rgba(2, 154, 98, 0.1);
      border-color: rgba(2, 154, 98, 0.3);
    }

    @media (max-width: 980px) {
      .sol-detail-hero__grid,
      .sol-overview__grid {
        grid-template-columns: 1fr;
      }
      .sol-flow__grid,
      .sol-benefits-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .sol-flow__grid,
      .sol-benefits-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
